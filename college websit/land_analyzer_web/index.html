<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Land Analyzer</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Advanced Land Analyzer</h1>

    <div class="search-container">
        <input type="text" id="addressInput" placeholder="Enter specific address or area...">
        <select id="radiusSelect">
            <option value="1000">1 KM</option>
            <option value="2000">2 km</option>
            <option value="3000" selected>3 KM</option>
            <option value="5000">5 KM</option>
        </select>
        <button onclick="searchAddress()">Search</button>
    </div>

    <div class="score-dashboard">
        <div class="score-card">
            <h3>Livability Score</h3>
            <div id="livabilityScore">--</div>
        </div>
        <div class="score-card">
            <h3>Area Rating</h3>
            <div id="areaRating" style="color: #ffc107; font-size: 24px;">⭐⭐⭐⭐⭐</div>
        </div>
    </div>

    <div id="map"></div>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <button onclick="analyze()">Detailed Analysis</button>
        <p id="result"></p>
    </div>

    <div id="placesList">
        <div class="tabs">
            <button class="tab-btn active" onclick="filterCategory('all')">All</button>
            <button class="tab-btn" onclick="filterCategory('hospital')">🏥 Hospitals</button>
            <button class="tab-btn" onclick="filterCategory('school')">🏫 Schools</button>
            <button class="tab-btn" onclick="filterCategory('shop')">🛍️ Shops</button>
            <button class="tab-btn" onclick="filterCategory('road')">🛣️ Roads</button>
            <button class="tab-btn" onclick="filterCategory('mettro stations')">🚇 Metro Stations</button>
            <button class="tab-btn" onclick="filterCategory('railway stations')">🚌 Railway Stations</button>

        </div>
        <div id="nearby">Click on the map or search an address to start...</div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
