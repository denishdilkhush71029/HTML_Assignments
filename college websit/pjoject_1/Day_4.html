<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Project</title>
    <!-- Imported Google Font: Yellowtail -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b08cd; /* Dark blue background */
            overflow-x: hidden;
        }

        /* Top Header with Canva Logo */
        .header {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .logo-img {
            width: 80px;
            height: auto;
        }

        /* Hero Section */
        .first {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 100px 20px 40px;
        }

        .yellowtail {
            font-family: 'Yellowtail', cursive;
            font-size: 100px;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #00c4cc, #7d2ae8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 50px;
            font-weight: 500;
        }

        /* Images Gallery */
        .gallery {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1200px;
        }

        .Box {
            width: 180px;
            height: 180px;
            border: 5px solid white; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .Box:hover {
            transform: scale(1.08) translateY(-10px) rotate(2deg);
            z-index: 10;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .Box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Border colors */
        .f1 { border-color: #4da9ff; } /* Light Blue */
        .f2 { border-color: #6da36d; } /* Green */
        .f3 { border-color: #ffffff; } /* White */
        .f4 { border-color: #d1a673; } /* Beige */
        .f5 { border-color: #e62e2e; } /* Red */

        /* Second Section */
        .secand {
            width: 100vw;
            min-height: 100vh;
            background-color: #c82333; /* Dark Red */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .yellowtail {
                font-size: 60px;
            }

            .subtitle {
                font-size: 20px;
                margin-bottom: 30px;
            }

            .Box {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://camo.githubusercontent.com/59b327309f4017376ee93392fc4d55a45e678e82f56023f506050850a1739309/68747470733a2f2f63646e33642e69636f6e73636f75742e636f6d2f33642f667265652f7468756d622f667265652d63616e76612d393233343635342d373531363837392e706e673f663d77656270" class="logo-img" alt="Canva Logo">
    </div>

    <div class="first">
        <h1 class="yellowtail">Canva</h1>
        <p class="subtitle">Edit your Ideas here</p>

        <div class="gallery">
            <div class="Box f1"><img src="https://plus.unsplash.com/premium_photo-1682089818097-20263df238cf?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Img 1"></div>
            <div class="Box f2"><img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab" alt="Img 2"></div>
            <div class="Box f3"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKDezgDfcL5NuGvpTkKt5YUydovnlhpAMiVQ&s" alt="Img 3"></div>
            <div class="Box f4"><img src="https://img.freepik.com/free-photo/3d-geometric-abstract-background_1048-11325.jpg?semt=ais_hybrid&w=740&q=80" alt="Img 4"></div>
            <div class="Box f5"><img src="https://thumbs.dreamstime.com/b/rainbow-puppy-butterfly-magical-night-scene-rainbow-puppy-butterfly-magical-night-scene-369783212.jpg" alt="Img 5"></div>
        </div>
    </div>

    <div class="secand">
        <h2 style="color: white;">Next Section Starts Here</h2>
    </div>

</body>
</html>
